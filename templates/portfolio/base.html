<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio Backend{% endblock %}</title>
  <meta name="description" content="Django portfolio focused on data systems, analytics workflows, and backend-driven product thinking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2354c7ff'/%3E%3Cstop offset='100%25' stop-color='%2385ffc6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2308111d'/%3E%3Cpath d='M18 46V18h15.5c7.8 0 12.5 4.2 12.5 10.6 0 6.7-4.8 10.9-12.8 10.9H25V46H18zm7-12.2h8.1c3.8 0 6-1.8 6-5s-2.2-4.9-6-4.9H25v9.9z' fill='url(%23g)'/%3E%3C/svg%3E">
  <style>{% include "portfolio/partials/site_css.html" %}</style>
</head>
<body>
  <div class="grid-glow"></div>
  <header class="site-header">
    <div class="shell nav-shell">
      <a class="brand" href="{% url 'home' %}">Data<span>Foundry</span></a>
      <nav class="site-nav">
        <a href="{% url 'home' %}#case-studies">Case Studies</a>
        <a href="{% url 'home' %}#pipeline">Pipeline</a>
        <a href="{% url 'home' %}#api">API</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <div class="shell footer-shell">
      <div>
        <p class="footer-label">Portfolio Backend</p>
        <strong>Django + Python + Data Product Thinking</strong>
      </div>
      <div class="footer-links">
        <a href="{% url 'api-snapshot' %}">Snapshot API</a>
        <a href="{% url 'api-case-studies' %}">Case Studies API</a>
      </div>
    </div>
  </footer>
  <script>{% include "portfolio/partials/site_js.html" %}</script>
</body>
</html>
